name: Build Mahyar Free VPN

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 6.0.x

    - name: Download sing-box v1.14
      shell: pwsh
      run: |
        $url = "https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-windows-amd64.zip"
        $output = "sing-box.zip"
        Invoke-WebRequest -Uri $url -OutFile $output
        Expand-Archive -Path $output -DestinationPath "sing-box-temp"
        $sourceExe = Get-ChildItem -Path "sing-box-temp" -Recurse -Filter "sing-box.exe" | Select-Object -First 1
        Copy-Item $sourceExe.FullName -Destination "src\MahyarFree\bin\sing-box.exe" -Force
        Write-Host "sing-box.exe copied to src\MahyarFree\bin\sing-box.exe"

    - name: Restore dependencies
      run: dotnet restore src/MahyarFree.sln

    - name: Build
      run: dotnet build src/MahyarFree.sln -c Release --no-restore

    - name: Publish single-file
      run: |
        dotnet publish src/MahyarFree/MahyarFree.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

    - name: Copy sing-box to output
      shell: pwsh
      run: |
        Copy-Item "src\MahyarFree\bin\sing-box.exe" -Destination "publish\sing-box.exe" -Force
        Get-ChildItem publish

    - name: Create ZIP package
      shell: pwsh
      run: |
        Compress-Archive -Path "publish\*" -DestinationPath "MahyarFree.zip" -Force
        Write-Host "Created: MahyarFree.zip"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: MahyarFree-VPN
        path: |
          publish/MahyarFree.exe
          publish/sing-box.exe
          MahyarFree.zip
        if-no-files-found: error
        retention-days: 30
